<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/styles.css">
	<title>Weather</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: 'Segoe UI', Arial, sans-serif;
			background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
			min-height: 100vh;
			color: #fff;
		}

		/* ── Nav Bar ── */
		.navbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 16px 32px;
			background: rgba(255, 255, 255, 0.07);
			backdrop-filter: blur(10px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		.navbar .logo {
			font-size: 1.3em;
			font-weight: 700;
			letter-spacing: 1px;
			color: #a8d8ea;
		}

		.navbar nav a {
			color: rgba(255, 255, 255, 0.75);
			text-decoration: none;
			margin-left: 24px;
			font-size: 0.95em;
			transition: color 0.2s;
		}

		.navbar nav a:hover {
			color: #fff;
		}

		/* ── Hero ── */
		.hero {
			text-align: center;
			padding: 48px 20px 24px;
		}

		.hero h1 {
			font-size: 2.4em;
			font-weight: 700;
			margin: 0 0 8px;
			letter-spacing: 1px;
		}

		.hero p {
			color: rgba(255, 255, 255, 0.6);
			font-size: 1em;
			margin: 0;
		}

		/* ── City Selector ── */
		.city-selector {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			margin: 28px 20px;
		}

		.city-selector label {
			font-size: 0.95em;
			color: rgba(255, 255, 255, 0.75);
		}

		.city-selector select {
			padding: 10px 18px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 30px;
			background: rgba(255, 255, 255, 0.12);
			color: #fff;
			font-size: 0.95em;
			cursor: pointer;
			outline: none;
			transition: border-color 0.2s, background 0.2s;
		}

		.city-selector select:hover,
		.city-selector select:focus {
			border-color: #a8d8ea;
			background: rgba(255, 255, 255, 0.18);
		}

		.city-selector select option {
			background: #16213e;
			color: #fff;
		}

		/* ── Cards ── */
		.card-container {
			display: flex;
			justify-content: center;
			flex-wrap: wrap;
			gap: 24px;
			padding: 10px 32px 60px;
		}

		.weather-card {
			background: rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(12px);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 20px;
			padding: 32px 36px;
			min-width: 220px;
			text-align: center;
			transition: transform 0.2s, box-shadow 0.2s;
		}

		.weather-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
		}

		.weather-card .icon {
			font-size: 2.8em;
			margin-bottom: 10px;
		}

		.weather-card h2 {
			font-size: 1em;
			font-weight: 600;
			color: rgba(255, 255, 255, 0.6);
			text-transform: uppercase;
			letter-spacing: 1px;
			margin: 0 0 14px;
		}

		.weather-card .value {
			font-size: 2.8em;
			font-weight: 700;
			color: #a8d8ea;
			margin-bottom: 6px;
		}

		.weather-card .sub {
			font-size: 0.88em;
			color: rgba(255, 255, 255, 0.5);
		}

		/* ── Loading / Error ── */
		.status-msg {
			text-align: center;
			color: rgba(255, 255, 255, 0.5);
			font-size: 1.05em;
			margin-top: 60px;
		}
		/* ── AI Summary ── */
		.ai-summary-section {
			max-width: 900px;
			margin: 0 auto 38px;
			text-align: left;
			padding: 0 20px;
		}

		.ai-summary-label {
			color: #9bc7dc;
			font-size: 0.78em;
			font-weight: 800;
			letter-spacing: 2px;
			text-transform: uppercase;
			margin-bottom: 10px;
		}

		.ai-summary-text {
			background: rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(12px);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 18px;
			padding: 24px 28px;
			color: rgba(255, 255, 255, 0.9);
			font-size: 1.05em;
			line-height: 1.7;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
		}

		.ai-summary-text.loading {
			color: rgba(255, 255, 255, 0.55);
		}
	</style>
</head>

<body>

	<div class="navbar">
		<span class="logo">&#9729; Weather</span>
		<nav>
			<a href="index.html">Home</a>
			<a href="stocks.html">Stocks</a>
			<a href="news.html">News</a>
			<a href="sports.html">Sports</a>
		</nav>
	</div>

	<div class="hero">
		<h1>Weather Dashboard</h1>
		<p>Live conditions for your selected city</p>
	</div>

	<div class="city-selector">
		<label for="citySelect">City</label>
		<select id="citySelect" onchange="fetchWeather()">
			<option value="philadelphia">Philadelphia, PA</option>
			<option value="newyork">New York, NY</option>
			<option value="london">London, UK</option>
			<option value="tokyo">Tokyo, Japan</option>
			<option value="losangeles">Los Angeles, CA</option>
			<option value="auto">Use My Location</option>
		</select>
	</div>

	<div class="ai-summary-section">
		<div class="ai-summary-label">AI WEATHER SUMMARY</div>
		<div id="ai-weather-summary" class="ai-summary-text loading">
			Analyzing current weather...
		</div>
	</div>

	<div id="weather-container" class="card-container">
		<div class="status-msg">Loading weather...</div>
	</div>

	<script>
		const GEMINI_API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";
const WEATHER_SUMMARY_CACHE_KEY = "weather_ai_summary_cache";
const CACHE_TTL = 12 * 60 * 60 * 1000;

function setWeatherSummary(text, state = "") {
	const el = document.getElementById("ai-weather-summary");
	if (!el) return;

	el.textContent = text;
	el.className = "ai-summary-text" + (state ? ` ${state}` : "");
}

function buildFallbackWeatherSummary(cityName, tempF, precip, wind) {
	let outfit = "Comfortable clothing should be fine.";

	if (tempF < 45) outfit = "A warm coat or heavier layers would be best.";
	else if (tempF < 65) outfit = "A light jacket or hoodie would be a good choice.";
	else if (tempF > 80) outfit = "Light clothing and water would be helpful.";

	const rainText = precip > 0 ? "There may be precipitation, so carrying an umbrella is a good idea." : "No major precipitation is showing right now.";

	return `The current weather in ${cityName} is ${tempF}°F with wind around ${wind ?? "N/A"} km/h. ${rainText} ${outfit}`;
}

async function generateAIWeatherSummary(cityName, tempF, tempC, precip, wind) {
	setWeatherSummary("Analyzing current weather...", "loading");

	const cacheKey = `${WEATHER_SUMMARY_CACHE_KEY}_${cityName}`;
	const cached = localStorage.getItem(cacheKey);

	if (cached) {
		const { text, timestamp } = JSON.parse(cached);
		if (Date.now() - timestamp < CACHE_TTL) {
			setWeatherSummary(text);
			return;
		}
	}

	const prompt = `
You are a weather assistant for a dashboard. Based on this weather data, write a 2-4 sentence summary.

City: ${cityName}
Temperature: ${tempF}°F / ${tempC}°C
Precipitation: ${precip} mm
Wind Speed: ${wind ?? "N/A"} km/h

Include what the weather feels like and what someone should wear. Keep it concise, friendly, and natural. Do not use bullet points or a title.
`;

	try {
		const response = await fetch(
			`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
			{
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({
					contents: [{ parts: [{ text: prompt }] }]
				})
			}
		);

		if (!response.ok) throw new Error(`Gemini API error: ${response.status}`);

		const data = await response.json();
		const summary = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

		if (!summary) throw new Error("Empty Gemini response");

		localStorage.setItem(cacheKey, JSON.stringify({
			text: summary,
			timestamp: Date.now()
		}));

		setWeatherSummary(summary);
	} catch (error) {
		console.error("AI weather summary error:", error);

		const fallback = buildFallbackWeatherSummary(cityName, Number(tempF), precip, wind);
		setWeatherSummary(fallback);
	}
}
		const CITIES = {
			philadelphia: { lat: 39.9526, lon: -75.1652, name: "Philadelphia, PA", tz: "America/New_York" },
			newyork:      { lat: 40.7128, lon: -74.0060, name: "New York, NY",      tz: "America/New_York" },
			london:       { lat: 51.5072, lon: -0.1276,  name: "London, UK",        tz: "Europe/London" },
			tokyo:        { lat: 35.6762, lon: 139.6503, name: "Tokyo, Japan",      tz: "Asia/Tokyo" },
			losangeles:   { lat: 34.0522, lon: -118.2437,name: "Los Angeles, CA",   tz: "America/Los_Angeles" },
		};
		async function fetchWeatherByCoords(lat, lon, cityName = "Your Location", tz = "auto") {
	const container = document.getElementById('weather-container');
	container.innerHTML = '<div class="status-msg">Loading weather...</div>';

	const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,windspeed_10m&timezone=${encodeURIComponent(tz)}&forecast_days=1`;

	try {
		const res = await fetch(url);
		const data = await res.json();

		if (data.hourly) {
			renderWeather(data, cityName);
		} else {
			container.innerHTML = '<div class="status-msg">No weather data found.</div>';
		}
	} catch (err) {
		console.error(err);
		container.innerHTML = '<div class="status-msg">Failed to load weather.</div>';
	}
}
		async function fetchWeather() {
	const container = document.getElementById('weather-container');
	const key = document.getElementById('citySelect').value;

	localStorage.setItem("last_city", key);

	if (key === "auto") {
		container.innerHTML = '<div class="status-msg">Detecting your location...</div>';

		if (!navigator.geolocation) {
			container.innerHTML = '<div class="status-msg">Geolocation is not supported by your browser.</div>';
			return;
		}

		navigator.geolocation.getCurrentPosition(
			(position) => {
				const lat = position.coords.latitude;
				const lon = position.coords.longitude;
				fetchWeatherByCoords(lat, lon, "Your Location", "auto");
			},
			(error) => {
				console.error(error);
				container.innerHTML = '<div class="status-msg">Unable to get your location.</div>';
			}
		);
		return;
	}

	const city = CITIES[key];
	const CACHE_KEY = `weather_cache_${key}`;
	const CACHE_TTL = 12 * 60 * 60 * 1000;

	container.innerHTML = '<div class="status-msg">Loading weather...</div>';

	const cached = localStorage.getItem(CACHE_KEY);
	if (cached) {
		const { data, timestamp } = JSON.parse(cached);
		if (Date.now() - timestamp < CACHE_TTL) {
			renderWeather(data, city.name);
			return;
		}
	}

	const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m,precipitation,windspeed_10m&timezone=${encodeURIComponent(city.tz)}&forecast_days=1`;

	try {
		const res = await fetch(url);
		const data = await res.json();
		if (data.hourly) {
			localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
			renderWeather(data, city.name);
		} else {
			container.innerHTML = '<div class="status-msg">No weather data found.</div>';
		}
	} catch (err) {
		console.error(err);
		if (cached) {
			renderWeather(JSON.parse(cached).data, city.name);
		} else {
			container.innerHTML = '<div class="status-msg">Failed to load weather.</div>';
		}
	}
}

		function renderWeather(data, cityName) {
			const container = document.getElementById('weather-container');
			const currentHour = new Date().getHours();
			const idx = Math.max(0, data.hourly.time.findIndex(t => new Date(t).getHours() === currentHour));

			const tempC   = data.hourly.temperature_2m[idx];
			const tempF   = ((tempC * 9) / 5 + 32).toFixed(1);
			const precip  = data.hourly.precipitation[idx];
			const wind    = data.hourly.windspeed_10m ? data.hourly.windspeed_10m[idx] : null;

			const precipIcon = precip > 0 ? '🌧️' : '☀️';
			const windIcon = wind !== null && wind > 20 ? '💨' : '🍃';

			container.innerHTML = `
				<div class="weather-card">
					<div class="icon">🌡️</div>
					<h2>Temperature</h2>
					<div class="value">${tempF}°F</div>
					<div class="sub">${tempC}°C &nbsp;·&nbsp; ${cityName}</div>
				</div>
				<div class="weather-card">
					<div class="icon">${precipIcon}</div>
					<h2>Precipitation</h2>
					<div class="value">${precip} mm</div>
					<div class="sub">Current hour &nbsp;·&nbsp; ${cityName}</div>
				</div>
				${wind !== null ? `
				<div class="weather-card">
					<div class="icon">${windIcon}</div>
					<h2>Wind Speed</h2>
					<div class="value">${wind} km/h</div>
					<div class="sub">Current hour &nbsp;·&nbsp; ${cityName}</div>
				</div>` : ''}
			`;
		generateAIWeatherSummary(cityName, tempF, tempC, precip, wind);

		}

		window.onload = fetchWeather;
	</script>

</body>
</html>
