<!DOCTYPE html>
<html>

<head>
    <title>Sports</title>

    <style>
        body {
            background-image: url("https://images.unsplash.com/photo-1520470082789-e347ad8b1944?w=1600&auto=format&fit=crop&q=60");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .overlay {
            background: rgba(0,0,0,0.65);
            min-height: 100vh;
            padding: 50px 30px;
            max-width: 1100px;
            margin: auto;
            border-radius: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Ethan Burr 4/24 */
        .navlinks {
            text-align: center;
            margin-bottom: 25px;
			color: white;
        }

        .navlinks a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        .navlinks a:hover {
            text-decoration: underline;
        }

        /* Ethan Burr 4/24 */
        .summary-container {
            margin-bottom: 40px;
        }

        /* Ethan Burr 4/24 */
        /* White themed AI banner */
        .summary-banner {
            display: inline-block;
            background: white;
            color: black;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Ethan Burr 4/24 */
		/* Ethan Burr 5/1 Update to sports-summary-box css */
        #sports-summary-box {
			background: rgba(255,255,255,0.12);
			border: 1px solid rgba(255,255,255,0.25);
			backdrop-filter: blur(12px);
			color: white;
			padding: 28px 32px;
			border-radius: 18px;
			font-size: 16px;
			line-height: 1.8;
			box-shadow: 0 10px 30px rgba(0,0,0,0.45);
			white-space: pre-wrap;
			max-height: 300px;
			overflow-y: auto;
		}
		
		#sports-summary-box {
			font-family: 'Segoe UI', Arial, sans-serif;
		}

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .filter-btn {
            padding: 12px 26px;
            border: 2px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.85);
            cursor: pointer;
            border-radius: 30px;
            font-weight: bold;
        }

        .filter-btn.active {
            background: white;
            color: black;
        }

        .card {
            display: none;
            background: rgba(255,255,255,0.12);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
        }
		
		/* Ethan Burr 5/1 Added css styling for new sections */
		.summary-headline {
			font-size: 20px;
			font-weight: bold;
			color: #FFD700;
			margin-bottom: 16px;
			border-bottom: 1px solid rgba(255,255,255,0.2);
			padding-bottom: 10px;
		}

		.summary-section-header {
			font-weight: bold;
			color: #90CAF9;
			margin-top: 14px;
			margin-bottom: 4px;
			font-size: 15px;
			letter-spacing: 0.5px;
		}
		
		.summary-bullet {
			padding: 2px 0 2px 16px;  /* reduced from 5px to 2px */
			border-left: 3px solid rgba(255,255,255,0.3);
			margin: 2px 0;             /* reduced from 5px to 2px */
			font-size: 15px;
		}
    </style>
</head>

<body>
<div class="overlay">

    <h1>Sports Dashboard</h1>

    <!--Ethan Burr 4/24-->
    <!-- Navigation links -->
    <div class="navlinks">
        <a href="index.html">Home</a> |
        <a href="stocks.html">Stocks</a> |
        <a href="news.html">News</a> |
        <a href="weather.html">Weather</a>
    </div>

    <!--Ethan Burr 4/24-->
    <div class="summary-container">
        <div class="summary-banner">AI SUMMARY</div>
        <div id="sports-summary-box">
            Loading AI summary...
        </div>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn" data-league="nba" onclick="toggleFilter('nba')">NBA</button>
        <button class="filter-btn" data-league="nfl" onclick="toggleFilter('nfl')">NFL</button>
        <button class="filter-btn" data-league="mlb" onclick="toggleFilter('mlb')">MLB</button>
        <button class="filter-btn" data-league="nhl" onclick="toggleFilter('nhl')">NHL</button>
        <button class="filter-btn" data-league="mls" onclick="toggleFilter('mls')">MLS</button>
        <button class="filter-btn" data-league="epl" onclick="toggleFilter('epl')">Premier League</button>
    </div>

    <div class="card" id="nba-card"><h2>NBA</h2><div id="nbaNews"></div></div>
    <div class="card" id="nfl-card"><h2>NFL</h2><div id="nflNews"></div></div>
    <div class="card" id="mlb-card"><h2>MLB</h2><div id="mlbNews"></div></div>
    <div class="card" id="nhl-card"><h2>NHL</h2><div id="nhlNews"></div></div>
    <div class="card" id="mls-card"><h2>MLS</h2><div id="mlsNews"></div></div>
    <div class="card" id="epl-card"><h2>Premier League</h2><div id="eplNews"></div></div>

    <script src="sportapi.js"></script>
	
	<script>
		function formatSummaryHTML(text) {
			if (!text) return text;

			// Bold the section headers that start with an emoji
			return text
				.replace(/HEADLINE:/g, '<div class="summary-headline">🏆 HEADLINE:</div>')
				.replace(/KEY RESULTS:/g, '<div class="summary-section-header">📊 KEY RESULTS:</div>')
				.replace(/TRENDS:/g, '<div class="summary-section-header">📈 TRENDS:</div>')
				.replace(/SPOTLIGHT:/g, '<div class="summary-section-header">⭐ SPOTLIGHT:</div>')
				.replace(/\*\*?(.*?)\*\*?/g, '<strong>$1</strong>')
				.replace(/^\*\s+(.+)$/gm, '<div class="summary-bullet">• $1</div>')
				.replace(/^-\s+(.+)$/gm, '<div class="summary-bullet">• $1</div>')
				.replace(/(<\/div>)<br>/g, '$1')  // ADD THIS - removes <br> after divs
				.replace(/\n/g, '<br>');
		}	

		// Override renderSummaryText to use innerHTML with formatting
		const _origRender = window.renderSummaryText;
		window.renderSummaryText = function(text) {
			const box = document.getElementById("sports-summary-box");
			if (box) box.innerHTML = formatSummaryHTML(text);
		};
	</script>

</div>
</body>
</html>
